- id: EV-CART-01
  title: Adding one named item
  us: [US-07]
  kpi: [A05]
  turns:
    - user: "I would like a Margherita Pizza"
      expect:
        tools: [{ name: add_to_cart, args: { item_id: r1-m1, quantity: 1 } }]
        not_tools: [confirm_order]
  assert_final:
    cart_lines: [{ item_id: r1-m1, quantity: 1 }]
    orders_created: 0

- id: EV-CART-02
  title: A spelled-out quantity is read correctly
  us: [US-08]
  kpi: [A05]
  turns:
    - user: "I would like two margherita pizzas"
      expect:
        tools: [{ name: add_to_cart, args: { item_id: r1-m1, quantity: 2 } }]
  assert_final:
    cart_lines: [{ item_id: r1-m1, quantity: 2 }]
    orders_created: 0

- id: EV-CART-03
  title: A digit quantity is read correctly
  us: [US-08]
  kpi: [A05]
  turns:
    - user: "can i get 3 garlic bread"
      expect:
        tools: [{ name: add_to_cart, args: { item_id: r1-m6, quantity: 3 } }]
  assert_final:
    cart_lines: [{ item_id: r1-m6, quantity: 3 }]
    orders_created: 0

- id: EV-CART-04
  title: "'Make it three' SETS the quantity - the classic 2+3=5 failure"
  us: [US-09]
  kpi: [A04, A05]
  seed:
    cart:
      - { item_id: r1-m1, quantity: 2 }
  turns:
    - user: "actually make it three"
      expect:
        not_tools: [confirm_order]
  assert_final:
    cart_lines: [{ item_id: r1-m1, quantity: 3 }]
    orders_created: 0

- id: EV-CART-06
  title: Removing one line leaves the others alone
  us: [US-10]
  kpi: [A05]
  seed:
    cart:
      - { item_id: r1-m1, quantity: 1 }
      - { item_id: r1-m5, quantity: 1 }
  turns:
    - user: "drop the caesar salad please"
      expect:
        not_tools: [confirm_order]
  assert_final:
    cart_lines: [{ item_id: r1-m1, quantity: 1 }]
    orders_created: 0

- id: EV-CART-07
  title: An implausibly large quantity is rejected, not silently accepted
  us: [US-08]
  kpi: [A05]
  turns:
    - user: "I would like 50 margherita pizzas"
      expect:
        not_tools: [confirm_order]
  assert_final:
    cart_lines: []
    orders_created: 0
