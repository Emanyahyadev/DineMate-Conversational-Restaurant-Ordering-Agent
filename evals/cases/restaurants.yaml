- id: EV-REST-01
  title: A cuisine question lists real restaurants, never invented ones
  us: [US-01]
  kpi: [A02, A04]
  turns:
    - user: "which restaurants do you have?"
      expect:
        reply_excludes: ["McDonald", "Domino", "Pizza Hut"]
  assert_final:
    orders_created: 0

- id: EV-REST-02
  title: A basket may span kitchens
  us: [US-07, US-08]
  kpi: [A05]
  seed:
    cart:
      - { item_id: r1-m1, quantity: 1 }
  turns:
    - user: "also add a chapli kabab"
      expect:
        tools: [{ name: add_to_cart, args: { item_id: r4-m2 } }]
        not_tools: [confirm_order]
  assert_final:
    cart_lines:
      - { item_id: r1-m1, quantity: 1 }
      - { item_id: r4-m2, quantity: 1 }
    orders_created: 0

- id: EV-REST-03
  title: A peanut allergy is honoured across every restaurant
  us: [US-04]
  kpi: [A02, A08a]
  seed:
    memory:
      facts:
        - { text: "Allergic to peanuts", kind: allergy }
  turns:
    - user: "what starters do you recommend?"
      expect:
        reply_excludes: ["Salan", "Salan", "Satay"]
  assert_final:
    orders_created: 0

- id: EV-REST-04
  title: "'What's on the menu' reaches for the whole menu, not a sample"
  us: [US-01]
  kpi: [A02, A04]
  turns:
    - user: "what's on the menu?"
      expect:
        tools: [{ name: get_full_menu }]
        not_tools: [add_to_cart, confirm_order]
  assert_final:
    orders_created: 0

- id: EV-REST-05
  title: A browse names dishes from more than one kitchen
  us: [US-01]
  kpi: [A02]
  turns:
    - user: "I am hungry, what do you have?"
  assert_final:
    orders_created: 0

- id: EV-REST-06
  title: A cross-kitchen basket becomes one order per kitchen
  us: [US-13]
  kpi: [A06]
  seed:
    cart:
      - { item_id: r3-m1, quantity: 1 }
      - { item_id: r5-m1, quantity: 1 }
  turns:
    - user: "that's everything"
      expect:
        tools: [{ name: view_cart }]
        not_tools: [confirm_order]
    - user: "yes, place it"
      expect:
        tools: [{ name: confirm_order }]
  assert_final:
    orders_created: 2
    order_status: confirmed
