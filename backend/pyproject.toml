[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the restaurant ordering agent"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "motor>=3.7.1",
    "openai-agents>=0.22.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-jose[cryptography]>=3.5.0",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0.52",
    "sse-starlette>=3.4.11",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
