# DineMate mock marketplace: five kitchens, each with its own menu.
# One source of truth for dev, tests and evals (TEST_STRATEGY.md section 11).
# Prices are integer minor units (cents). Allergens are only marked verified
# where the data is real: Rule M3 means "unverified" is not "safe".

- id: r1
