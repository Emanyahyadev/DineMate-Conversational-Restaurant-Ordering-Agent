# DineMate marketplace: five Pakistani kitchens, each with its own menu.
# One source of truth for dev, tests and evals (TEST_STRATEGY.md section 11).
#
# Prices are whole rupees (CURRENCY_DECIMALS=0, so the minor unit IS the rupee).
# Everything here is halal, so `halal` is tagged on every dish rather than left
# implied - a customer filtering for it should get the whole menu, not silence.
# `allergens_verified` is only true where the allergen list is genuinely complete;
# Rule M3 means unverified is never treated as safe.

